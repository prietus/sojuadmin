# Minimal permissions for the sidecar: get/patch only soju's ConfigMap,
# and read its pod and logs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: soju-admin
  namespace: soju
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: soju-admin
  namespace: soju
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["soju-config"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: soju-admin
  namespace: soju
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: soju-admin
subjects:
  - kind: ServiceAccount
    name: soju-admin
    namespace: soju
