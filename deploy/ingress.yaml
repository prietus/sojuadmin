# Copy to ingress.local.yaml (git-ignored) and set your real hostname.
apiVersion: v1
kind: Service
metadata:
  name: soju-admin
  namespace: soju
spec:
  selector:
    app: soju
  ports:
    - name: http
      port: 8090
      targetPort: admin
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: soju-admin
  namespace: soju
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`soju-admin.example.org`)
      services:
        - name: soju-admin
          port: 8090
  tls: {}
